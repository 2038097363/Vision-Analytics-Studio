[package]
name = "vision-analytics-studio"
version = "0.1.0"
description = "A local-first visual analytics desktop workspace"
authors = ["Vision Analytics Studio"]
edition = "2021"

[lib]
name = "vision_analytics_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
mime_guess = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff"] }
